name: Release DDS Tweak

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.repository == 'x-oOvOo-x/DDS-Tweak' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          [[ -n "$MOD_VERSION" ]] || { echo 'mod_version is missing'; exit 1; }
          [[ "$GITHUB_REF_NAME" == "v${MOD_VERSION}" ]] || { echo "Tag $GITHUB_REF_NAME does not match mod_version=$MOD_VERSION"; exit 1; }
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          [[ -f "$NOTES" ]] || { echo "Release notes not found: $NOTES"; exit 1; }
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"
      - name: Verify and build
        run: gradle build --stacktrace
      - name: Locate release jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'dds-tweak-v*.jar' ! -name '*-sources.jar' | head -n 1)"
          [[ -n "$JAR" ]] || { echo 'Release jar not found'; exit 1; }
          echo "RELEASE_JAR=$JAR" >> "$GITHUB_ENV"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "DDS Tweak $MOD_VERSION" --notes-file "$RELEASE_NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "DDS Tweak $MOD_VERSION" --notes-file "$RELEASE_NOTES"
          fi
          gh release upload "$GITHUB_REF_NAME" "$RELEASE_JAR" --clobber
