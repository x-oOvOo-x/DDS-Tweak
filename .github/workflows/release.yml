name: Release DDS Tweak

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'INSPECT v0.1.0 (read-only) or RECOVER v0.1.0 (upload)'
        required: true
        type: string
      mc_26_3_version_id:
        description: 'Exact Minecraft 26.3 ID confirmed after inspection (required for recovery)'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/**'
      - 'src/**'
      - 'versions/**'
      - 'config/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'common.gradle'
      - 'settings.gradle'
      - 'settings.json'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-tooling:
    name: Verify Public candidate (no publication)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Run offline release tooling tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Set up all game Java toolchains (Gradle on JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            16
            17
            21
            25
      - name: Set up Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Build all 21 Minecraft targets without publishing
        run: |
          chmod +x ./gradlew
          ./gradlew buildAndGather --stacktrace
      - name: Verify production JAR inventory and hashes
        run: |
          python3 tools/validate_release_artifacts.py \
            --directory build/releases \
            --source-sha "$GITHUB_SHA" \
            --manifest build/p5/public-release-manifest.json \
            --production

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'x-oOvOo-x/DDS-Tweak' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up all game Java toolchains (Gradle on JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            16
            17
            21
            25
      - name: Set up Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          [[ "$MOD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Formal mod_version must be X.Y.Z'; exit 1; }
          [[ "$GITHUB_REF_NAME" == "v${MOD_VERSION}" ]] || { echo "Tag $GITHUB_REF_NAME does not match mod_version=$MOD_VERSION"; exit 1; }
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          [[ -f "$NOTES" ]] || { echo "Release notes not found: $NOTES"; exit 1; }
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"
      - name: Check CurseForge publication credentials
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CURSEFORGE_API_TOKEN" || { echo 'Configure CURSEFORGE_API_TOKEN in Public repository secrets'; exit 1; }
      - name: Verify and build all active versions
        run: |
          chmod +x ./gradlew
          ./gradlew buildAndGather --stacktrace
      - name: Validate all runtime JARs and production manifest
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/validate_release_artifacts.py \
            --directory build/releases \
            --source-sha "$GITHUB_SHA" \
            --manifest build/p5/public-release-manifest.json \
            --production
      - name: Stage, verify and publish complete formal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists: $GITHUB_REF_NAME; refusing to overwrite it"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "DDS Tweak $MOD_VERSION" --notes-file "$RELEASE_NOTES"
          gh release upload "$GITHUB_REF_NAME" build/releases/*.jar build/p5/public-release-manifest.json
          # The releases/tags endpoint only serves published releases; this one is still a draft.
          DRAFT_RELEASE_ID="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq '.databaseId')"
          [[ "$DRAFT_RELEASE_ID" =~ ^[0-9]+$ ]] || { echo 'Cannot resolve the staged Draft Release ID'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > build/p5/staged-release.json
          python3 tools/check_release_assets.py \
            --manifest build/p5/public-release-manifest.json \
            --release-json build/p5/staged-release.json \
            --tag "$GITHUB_REF_NAME"
      - name: Upload verified files to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          MC_26_3_ID: ${{ vars.CURSEFORGE_MC_26_3_VERSION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$MC_26_3_ID" ]]; then args+=(--mc-26-3-id "$MC_26_3_ID"); fi
          python3 tools/upload_curseforge.py \
            --directory build/releases \
            --manifest build/p5/public-release-manifest.json \
            --changelog "$RELEASE_NOTES" \
            --project-id 1734610 \
            --release-type release \
            --receipt build/p5/curseforge-receipt.json "${args[@]}"
      - name: Publish verified GitHub draft and retain CurseForge receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" build/p5/curseforge-receipt.json
          gh release edit "$GITHUB_REF_NAME" --draft=false

  inspect-v010:
    name: Inspect CurseForge v0.1.0 version IDs (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'INSPECT v0.1.0' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Query supported CurseForge Author API without uploading
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CURSEFORGE_API_TOKEN" || { echo 'Missing CurseForge Author API token'; exit 1; }
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "tools")
          from upload_curseforge import API_BASE, request_json
          versions = request_json(API_BASE + "/api/game/versions",
                                  os.environ["CURSEFORGE_API_TOKEN"])
          if not isinstance(versions, list):
              raise SystemExit("CurseForge versions API did not return a list")
          print("READ ONLY: no upload POST requests will be made.")
          for name in ("Fabric", "26.3"):
              matches = [
                  item for item in versions
                  if isinstance(item, dict) and item.get("name") == name
              ]
              print(f"CurseForge {name}: {len(matches)} candidate(s)")
              for item in matches:
                  typ = item.get("gameVersionTypeID")
                  siblings = sorted({
                      other.get("name", "")
                      for other in versions
                      if isinstance(other, dict) and other.get("gameVersionTypeID") == typ
                      and isinstance(other.get("name"), str)
                  })
                  print(f"  id={item.get('id')}, type={typ}, slug={item.get('slug')},"
                        f" same-type examples={siblings[:12]}")
          print("Verify the Minecraft 26.3 version ID against CurseForge "
                "Author Dashboard before running RECOVER.")
          PY

  recover-v010:
    name: Resume verified v0.1.0 Draft (manual, one time)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RECOVER v0.1.0' && github.repository == 'x-oOvOo-x/DDS-Tweak' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Require explicit recovery confirmation and immutable original tag
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == 'RECOVER v0.1.0' ]] || { echo 'Explicit recovery confirmation required'; exit 1; }
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Recovery must run from Public main'; exit 1; }
          git fetch --no-tags origin refs/tags/v0.1.0
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == 'f85b69257847d95a68de963bb71bf3b08ce0e183' ]] || {
            echo 'The v0.1.0 tag moved; refusing to publish'; exit 1;
          }
      - name: Require reviewed Minecraft 26.3 version ID
        env:
          MC_26_3_ID: ${{ inputs.mc_26_3_version_id }}
        shell: bash
        run: |
          [[ "$MC_26_3_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Inspect the Author API first and provide a verified 26.3 ID'; exit 1;
          }
      - name: Download and verify the existing 22 Draft assets (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/releases build/p5
          gh api "repos/$GITHUB_REPOSITORY/releases/433864863" > build/p5/staged-release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('build/p5/staged-release.json').read_text())
          if (release.get('id') != 433864863 or release.get('tag_name') != 'v0.1.0'
                  or release.get('draft') is not True or release.get('prerelease') is True
                  or len(release.get('assets', [])) != 22
                  or any(asset.get('name') == 'curseforge-receipt.json'
                         for asset in release['assets'])):
              raise SystemExit('Draft release state changed; manual review required')
          PY
          gh release download v0.1.0 --dir build/releases --pattern 'dds-tweak-v0.1.0-mc*.jar'
          gh release download v0.1.0 --dir build/p5 --pattern 'public-release-manifest.json'
          python3 tools/check_release_assets.py \
            --manifest build/p5/public-release-manifest.json \
            --release-json build/p5/staged-release.json --tag v0.1.0
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('build/p5/public-release-manifest.json').read_text())
          if (manifest.get('source_sha') != 'f85b69257847d95a68de963bb71bf3b08ce0e183'
                  or manifest.get('mod_version') != '0.1.0'
                  or len(manifest.get('artifacts', [])) != 21):
              raise SystemExit('Not the original verified v0.1.0 manifest')
          PY
          python3 tools/validate_release_artifacts.py \
            --directory build/releases \
            --source-sha f85b69257847d95a68de963bb71bf3b08ce0e183 \
            --manifest build/p5/revalidated-manifest.json --production
          cmp build/p5/public-release-manifest.json build/p5/revalidated-manifest.json
      - name: Run corrected upload unit tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Upload v0.1.0 JARs to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          MC_26_3_ID: ${{ inputs.mc_26_3_version_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CURSEFORGE_API_TOKEN" || { echo 'Missing CurseForge Author API token'; exit 1; }
          python3 tools/upload_curseforge.py \
            --directory build/releases \
            --manifest build/p5/public-release-manifest.json \
            --changelog docs/release-notes/v0.1.0.md \
            --project-id 1734610 --release-type release \
            --receipt build/p5/curseforge-receipt.json \
            --mc-26-3-id "$MC_26_3_ID"
      - name: Publish GitHub Draft only after all CurseForge file IDs are confirmed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('build/p5/curseforge-receipt.json').read_text())
          if (receipt.get('source_sha') != 'f85b69257847d95a68de963bb71bf3b08ce0e183'
                  or receipt.get('version') != '0.1.0'
                  or len(receipt.get('files', [])) != 21
                  or len({item['minecraft'] for item in receipt['files']}) != 21
                  or any(type(item.get('curseforge_file_id')) is not int
                         or item['curseforge_file_id'] <= 0 for item in receipt['files'])):
              raise SystemExit('Incomplete CurseForge upload receipt; keep GitHub Draft')
          PY
          gh api "repos/$GITHUB_REPOSITORY/releases/433864863" --jq '.draft' | grep -qx true
          gh release upload v0.1.0 build/p5/curseforge-receipt.json
          gh release edit v0.1.0 --draft=false
      - name: Retain partial receipt when recovery fails; do not rerun blindly
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-v0.1.0-partial-receipt-${{ github.run_id }}
          path: build/p5/curseforge-receipt.json
          if-no-files-found: ignore
          retention-days: 30
