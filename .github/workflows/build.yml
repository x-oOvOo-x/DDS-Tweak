name: Build DDS Tweak

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
      - 'common.gradle'
      - 'settings.json'
      - 'config/**'
      - 'versions/**'
      - '.github/workflows/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
      - 'common.gradle'
      - 'settings.json'
      - 'config/**'
      - 'versions/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  build-self-hosted:
    if: ${{ (vars.RUNNER_MODE == 'self-hosted' || (vars.RUNNER_MODE == '' && github.repository == 'x-oOvOo-x/DDS-Tweak-Dev')) && (github.event_name != 'pull_request' || github.event.action != 'closed') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - name: Clean workspace except Loom cache
        shell: cmd
        run: git clean -ffdx -e .gradle/
      - name: Configure persistent short Gradle home
        shell: powershell
        run: |
          $drive = [System.IO.Path]::GetPathRoot($env:RUNNER_WORKSPACE)
          $gradleHome = Join-Path $drive 'g\dds-tweak'
          New-Item -ItemType Directory -Force -Path $gradleHome | Out-Null
          "GRADLE_USER_HOME=$gradleHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Verify and build
        shell: cmd
        run: gradlew.bat buildAndGather --stacktrace
      - name: Publish rolling prerelease
        if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CI_TAG: "${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'ci-main' }}"
          CI_NAME: "${{ github.event_name == 'pull_request' && format('CI PR {0}', github.event.pull_request.number) || 'CI main' }}"
          TARGET_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content 'settings.json' -Raw | ConvertFrom-Json
          $expected = @($cfg.activeVersions).Count
          $jars = @(Get-ChildItem 'build/releases/dds-tweak-v*.jar' -File | Sort-Object Name)
          if ($jars.Count -ne $expected) { throw "Expected $expected DDS Tweak test JARs, found $($jars.Count): $($jars.Name -join ', ')" }
          $api = "https://api.github.com/repos/$env:GH_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28'; 'User-Agent' = 'DDS-Tweak-CI' }
          $release = $null
          try { $release = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$env:CI_TAG" -Method Get -ErrorAction Stop }
          catch {
            $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($status -ne 404) { throw }
          }
          $meta = @{ tag_name = $env:CI_TAG; target_commitish = $env:TARGET_SHA; name = $env:CI_NAME; body = "Automated tested build from $env:TARGET_SHA"; draft = $false; prerelease = $true }
          if ($null -eq $release) {
            $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Uri "$api/releases" -Body ($meta | ConvertTo-Json)
          } else {
            $ref = @{ sha = $env:TARGET_SHA; force = $true } | ConvertTo-Json
            Invoke-RestMethod -Method Patch -Headers $headers -ContentType 'application/json' -Uri "$api/git/refs/tags/$env:CI_TAG" -Body $ref | Out-Null
            $release = Invoke-RestMethod -Method Patch -Headers $headers -ContentType 'application/json' -Uri "$api/releases/$($release.id)" -Body ($meta | ConvertTo-Json)
          }
          foreach ($asset in @($release.assets | Where-Object { $_.name -like 'dds-tweak-v*.jar' })) {
            Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/releases/assets/$($asset.id)"
          }
          $upload = $release.upload_url -replace '\{\?name,label\}$',''
          foreach ($jar in $jars) {
            $assetName = $jar.Name
            $encodedName = [Uri]::EscapeDataString($assetName)
            & curl.exe --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/java-archive' --data-binary "@$($jar.FullName)" "${upload}?name=$encodedName" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed with curl exit code $LASTEXITCODE" }
            Write-Host "Download: https://github.com/$env:GH_REPOSITORY/releases/download/$env:CI_TAG/$assetName"
          }

  cleanup-pr-release:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Remove rolling PR prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CI_TAG: ci-pr-${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "https://api.github.com/repos/$env:GH_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28'; 'User-Agent' = 'DDS-Tweak-CI' }
          $release = $null
          try { $release = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$env:CI_TAG" -Method Get -ErrorAction Stop }
          catch {
            $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($status -ne 404) { throw }
          }
          if ($null -ne $release) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/releases/$($release.id)" }
          try { Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/git/refs/tags/$env:CI_TAG" }
          catch {
            $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($status -ne 404) { throw }
          }

  build-cloud:
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'closed') && (vars.RUNNER_MODE == 'cloud' || (vars.RUNNER_MODE == '' && github.repository == 'x-oOvOo-x/DDS-Tweak')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify and build
        run: ./gradlew buildAndGather --stacktrace
      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: dds-tweak-${{ github.sha }}
          path: build/releases/dds-tweak-v*.jar
          retention-days: 7
