import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://jitpack.io'; content { includeGroupAndSubgroups('com.github') } }
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.replaymod.preprocess') useModule("com.github.x-oOvOo-x:preprocessor:${requested.version}")
        }
    }
}

plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }

rootProject.name = 'DDS-Tweak'
def cfg = new JsonSlurper().parseText(file('settings.json').text)
for (String version : cfg.versions) {
    include(":${version}")
    def p = project(":${version}")
    p.projectDir = file("versions/${version}")
    p.buildFileName = '../../common.gradle'
}
